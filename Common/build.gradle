plugins {
  id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT'
}

archivesBaseName = "${mod_name}-common-${minecraft_version}"

minecraft {
  version(minecraft_version)
  runs {
    server('vanilla_server') {
      workingDirectory(this.file("run"))
    }
    client('vanilla_client') {
      workingDirectory(this.file("run"))
    }
  }
}

dependencies {
  compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
  testImplementation platform('org.junit:junit-bom:5.10.2')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
  useJUnitPlatform()
  testLogging {
    events 'failed'
    exceptionFormat = 'full'
  }
}

apply from: "$projectDir/../gradle/tasks/glowStickColors.gradle"
apply from: "$projectDir/../gradle/tasks/generateGlowStickColorVariants.gradle"
apply from: "$projectDir/../gradle/tasks/generateGlowStickDynamicLights.gradle"
apply from: "$projectDir/../gradle/tasks/generateGlowStickTags.gradle"
apply from: "$projectDir/../gradle/tasks/generateGlowStickRecipes.gradle"
apply from: "$projectDir/../gradle/tasks/generateCreativeGlowStickRecipes.gradle"
apply from: "$projectDir/../gradle/tasks/generateGlowStickLootTables.gradle"
apply from: "$projectDir/../gradle/tasks/generateGlowStickAssets.gradle"

processResources {

  def buildProps = project.properties.clone()

  filesMatching(['pack.mcmeta']) {
    expand buildProps
  }
}
