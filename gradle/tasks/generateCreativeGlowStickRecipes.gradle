// Configuration
ext {
  creativeRecipePath = "$glowStickDataPath/recipes"
  creativeRecipeAdvancementPath = "$glowStickDataPath/advancements/recipes/crafting"
  creativeRecipeCondition = "glow_sticks:creative_recipe_enabled"
}

tasks.register("generateCreativeGlowStickRecipes") {
  group = "build"
  description = "Generates the config gated survival recipes for all creative glow sticks."

  doLast {
    def recipeDir = new File(creativeRecipePath)
    def advancementDir = new File(creativeRecipeAdvancementPath)
    [recipeDir, advancementDir].each { directory ->
      if (!directory.exists()) {
        directory.mkdirs()
      }
    }

    // Forge 1.20.1 reads the top level "conditions" key, Fabric API reads "fabric:load_conditions".
    def loaderConditions = { [
        "conditions"           : [[type: creativeRecipeCondition]],
        "fabric:load_conditions": [[condition: creativeRecipeCondition]]
    ] }

    glowStickColors.each { color ->
      def recipeId = "glow_sticks:creative_glow_stick_${color}"

      writeGlowStickJson(new File(recipeDir, "creative_glow_stick_${color}.json"), [
          type: "minecraft:crafting_shapeless"
      ] + loaderConditions() + [
          ingredients: [
              [item: "glow_sticks:glow_stick_${color}"],
              [item: "minecraft:glowstone"],
              [item: "minecraft:echo_shard"]
          ],
          result     : [item: "glow_sticks:creative_glow_stick_${color}", count: 1]
      ])

      writeGlowStickJson(new File(advancementDir, "creative_glow_stick_${color}.json"), [
          parent: "minecraft:recipes/root"
      ] + loaderConditions() + [
          rewards     : [recipes: [recipeId]],
          criteria    : [
              has_glow_stick: [
                  trigger   : "minecraft:inventory_changed",
                  conditions: [items: [[items: ["glow_sticks:glow_stick_${color}"]]]]
              ],
              has_echo_shard: [
                  trigger   : "minecraft:inventory_changed",
                  conditions: [items: [[items: ["minecraft:echo_shard"]]]]
              ],
              has_the_recipe: [
                  trigger   : "minecraft:recipe_unlocked",
                  conditions: [recipe: recipeId]
              ]
          ],
          requirements: [["has_glow_stick", "has_echo_shard", "has_the_recipe"]]
      ])
    }

    println "✔ Generated ${glowStickColors.size() * 2} creative glow stick recipe files"
  }
}
