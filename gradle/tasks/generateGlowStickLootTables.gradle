// Configuration
ext {
  lootTablePath = "$glowStickDataPath/loot_table/blocks"
}

tasks.register("generateGlowStickLootTables") {
  group = "build"
  description = "Generates the block loot tables for all glow stick blocks."

  doLast {
    def lootTableDir = new File(lootTablePath)
    if (!lootTableDir.exists()) {
      lootTableDir.mkdirs()
    }

    def singleItemLootTable = { itemName ->
      [
          type : "minecraft:block",
          pools: [
              [
                  rolls  : 1,
                  bonus_rolls: 0,
                  entries: [
                      [
                          type: "minecraft:item",
                          name: "glow_sticks:${itemName}"
                      ]
                  ],
                  conditions: [
                      [condition: "minecraft:survives_explosion"]
                  ]
              ]
          ]
      ]
    }

    glowStickColors.each { color ->
      writeGlowStickJson(
          new File(lootTableDir, "glow_stick_${color}.json"),
          singleItemLootTable("glow_stick_${color}"))
      writeGlowStickJson(
          new File(lootTableDir, "creative_glow_stick_${color}.json"),
          singleItemLootTable("creative_glow_stick_${color}"))
    }

    ["glow_stick_light", "glow_stick_light_water"].each { lightBlock ->
      writeGlowStickJson(
          new File(lootTableDir, "${lightBlock}.json"), [type: "minecraft:block", pools: []])
    }

    println "✔ Generated ${glowStickColors.size() * 2 + 2} glow stick loot tables"
  }
}
