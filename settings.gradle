pluginManagement {
  repositories {
    gradlePluginPortal()
    maven {
      name = 'Fabric'
      url = 'https://maven.fabricmc.net/'
    }
    maven {
      name = 'NeoForge'
      url = 'https://maven.neoforged.net/releases/'
    }
    maven {
      name = 'Forge'
      url = 'https://maven.minecraftforge.net/'
    }
    maven {
      name = 'Sponge Snapshots'
      url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
  }
}

rootProject.name = 'Glow Sticks 26.3'
// Forge has no Minecraft 26.3 release yet, latest is 65.0.0 for 26.2. ForgeGradle resolves the
// userdev artifact during configuration, so the subproject has to be excluded here, not per task.
include("Common", "Fabric", "NeoForge")
// include("Forge")
